[project]
name = "pdf-ops"
version = "0.1.0"
description = "Containerized PDF operations (merge, extract attachments) for workflow systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "29573973+Radko-D@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pikepdf>=10.12.0",
]

[project.scripts]
pdf-ops = "pdf_ops.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "ARG", "RUF",
    "SIM", "PTH", "PIE", "RET", "PERF", "FURB", "N",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]  # Unused args common in pytest (fixtures, side effects)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["pdf_ops"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", "docs/scripts"]
exclude = [".venv", "__pycache__", "build", "dist"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnusedImport = false
reportPrivateUsage = false
# An ignore comment that suppresses nothing is drift - keep them honest.
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers -m 'not container'"
markers = [
    "unit: Unit tests of pure functions and mappings",
    "integration: In-process end-to-end tests through run(env)",
    "container: Tests that build and run the Docker image",
    "slow: Tests that take longer to run",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pypdf[crypto]>=6.16.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
